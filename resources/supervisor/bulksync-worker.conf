; ─────────────────────────────────────────────────────────
; Supervisor config for BulkSync queue workers
; Copy to: /etc/supervisor/conf.d/bulksync-worker.conf
; Then run: supervisorctl reread && supervisorctl update
;
; NOTE: on Cloudways this file lives at the SERVER level, shared by every
; application on the box. Editing it here does not change the deployed one —
; it has to be edited on the server by hand.
; ─────────────────────────────────────────────────────────

[program:bulksync-worker]
process_name=%(program_name)s_%(process_num)02d
; ── Queue order matters ─────────────────────────────────
; Laravel drains queues left to right: it empties bulkupload-scan before it
; touches bulkupload. That is the whole point of the split.
;
;   bulkupload-scan  folder reads. Seconds of work, and somebody is watching
;                    a page waiting for it.
;   bulkupload       photo edits, pushes, AI content. Minutes to hours, and
;                    nobody is watching any single one of them.
;
; Both on one queue meant a second person's Fetch photos sat behind the first
; person's entire run and looked broken.
command=php /home/master/applications/YOUR_APP/public_html/artisan queue:work redis --queue=bulkupload-scan,bulkupload --sleep=1 --tries=3 --timeout=1800 --max-jobs=500 --max-time=3600
directory=/home/master/applications/YOUR_APP/public_html
autostart=true
autorestart=true
user=YOUR_SYSTEM_USER
; ── Number of parallel workers ──────────────────────────
; This is what decides whether two people can edit at the same time. One
; worker serialises everybody. Photoroom's own per-minute ceiling
; (services.photoroom.rpm) caps the useful number — past that the workers
; just wait on each other in the shared pacing lock.
numprocs=8
; ─────────────────────────────────────────────────────────
redirect_stderr=true
stdout_logfile=/home/master/applications/YOUR_APP/public_html/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=1800
